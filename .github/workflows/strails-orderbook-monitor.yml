name: strails-orderbook-monitor

on:
  schedule:
    # Every 10 minutes (best-effort; GitHub may delay scheduled runs).
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: strails-orderbook-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check strails orderbook status
        id: check
        run: |
          response=$(curl -s --max-time 20 "https://trade.numofx.com/api/strails/orderbook" || echo '{"status":"unreachable"}')
          status=$(echo "$response" | jq -r '.status // "unreachable"' 2>/dev/null || echo "unreachable")
          detail=$(echo "$response" | jq -r '.detail // empty' 2>/dev/null || true)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "Book status: $status${detail:+ — $detail}"

      - name: Raise alert issue when degraded
        if: steps.check.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          gh label create strails-monitor --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Automated strails orderbook alerts" --force 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label strails-monitor --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label strails-monitor \
              --title "Strails orderbook degraded: users are seeing preview data" \
              --body "The spot panel has silently fallen back to the simulated preview book.

- **Status:** \`$STATUS\`
- **Detail:** ${DETAIL:-n/a}
- **Endpoint:** https://trade.numofx.com/api/strails/orderbook
- **Runbook:** README → *Strails spot liquidity (read-only)*. If the detail says \`IP_NOT_ALLOWED\`, fiat-service's Railway egress IP changed — check \`/api/strails/egress\` on fiat-service's side and strails' \`/manageipallowlist\`. If fiat-service is down, check the Railway deployment.

This issue closes automatically when the monitor sees \`ok\` again."
          fi

      - name: Close alert issue on recovery
        if: steps.check.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label strails-monitor --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Monitor sees \`status: ok\` again — live book restored."
          fi

      - name: Fail run when degraded
        if: steps.check.outputs.status != 'ok'
        run: exit 1
